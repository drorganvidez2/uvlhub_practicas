name: Deploy to Render

on:
    # Modificacion 3: desplegar cuando se crea un tag.
    push:
      tags:
      - 'v*'
    # Modificacion 1: y cuando se cierra un pull request contra main. Se escucha
    # "closed", no la apertura: cerrar incluye tanto mergear como descartar, y
    # abajo se comprueba cual de las dos fue.
    pull_request:
      types: [closed]
      branches:
        - main

jobs:

  testing:

    name: Run Tests
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:12.0.2
        env:
          MARIADB_ROOT_PASSWORD: uvlhub_root_password
          MARIADB_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -u root -p$MARIADB_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:

    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ./rosemary

    - name: Run Tests
      env:
        FLASK_ENV: testing
        MARIADB_HOSTNAME: 127.0.0.1
        MARIADB_PORT: 3306
        MARIADB_TEST_DATABASE: uvlhubdb_test
        MARIADB_USER: uvlhub_user
        MARIADB_PASSWORD: uvlhub_password
      run: |
        pytest app/features/ --ignore-glob='*selenium*'

  deploy:
    name: Deploy to Render
    # Modificacion 2: solo se despliega si el job de pruebas ha terminado en
    # verde. "needs" ya cancela este job si el anterior falla.
    needs: testing
    # Modificacion 1: y solo si el pull request se ha mergeado de verdad. Sin
    # esta condicion tambien se desplegaria al cerrar un pull request
    # descartado. En un push de tag no hay pull_request, de ahi la primera rama.
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Deploy to Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"
